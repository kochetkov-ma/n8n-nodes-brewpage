name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Format, lint, build and unit tests
        run: |
          set -euo pipefail
          npm run format
          npm run lint
          npm run build
          npm test
      - name: Native n8n engine fixtures
        run: |
          set -euo pipefail
          docker pull docker.n8n.io/n8nio/n8n@sha256:942bc274709f27f99f7c6024a785d8e8f75ac06838cabcba448abb8d9127ec7b
          npm run test:native
