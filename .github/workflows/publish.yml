# Publishes to npm with provenance on a vX.Y.Z tag; auth is npm trusted publishing (OIDC).
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'kochetkov-ma/n8n-nodes-brewpage'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm and match the tag to package.json
        run: |
          set -euo pipefail
          npm install --global npm@11.15.0 --ignore-scripts
          test "$(npm --version)" = 11.15.0
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Format, build, unit and native checks
        run: |
          set -euo pipefail
          npm run format
          npm run build
          npm test
          docker pull docker.n8n.io/n8nio/n8n@sha256:942bc274709f27f99f7c6024a785d8e8f75ac06838cabcba448abb8d9127ec7b
          npm run test:native
      - name: Lint, build and publish with provenance
        run: npm run release
